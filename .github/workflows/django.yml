name: Django CI/CD

on:
  push:
    branches: [ develop, feature/homework_34_2 ]
  pull_request:
    branches: [ develop ]

env:
  SECRET_KEY: ${{ secrets.SECRET_KEY }}
  DATABASE_URL: ${{ secrets.DATABASE_URL }}
  STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
  STRIPE_PUBLIC_KEY: ${{ secrets.STRIPE_PUBLIC_KEY }}

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Poetry
      run: |
        curl -sSL https://install.python-poetry.org | python3 -
        echo "$HOME/.local/bin" >> $GITHUB_PATH

    - name: Install dependencies
      run: |
        poetry install --no-root
        
    - name: Install system dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libpq-dev gcc

    - name: Run migrations
      run: |
        poetry run python manage.py migrate
      env:
        DEBUG: "True"
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test_db
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        ALLOWED_HOSTS: localhost,127.0.0.1

    - name: Run tests
      run: |
        poetry run python manage.py test --noinput
      env:
        DEBUG: "True"
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        ALLOWED_HOSTS: localhost,127.0.0.1

    - name: Run coverage
      run: |
        poetry run coverage run --source='.' manage.py test --noinput
        poetry run coverage report
        poetry run coverage xml
      env:
        DEBUG: "True"
        DB_NAME: test_db
        DB_USER: postgres
        DB_PASSWORD: postgres
        DB_HOST: localhost
        DB_PORT: 5432
        REDIS_HOST: localhost
        REDIS_PORT: 6379
        ALLOWED_HOSTS: localhost,127.0.0.1

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

    - name: Set up Docker Compose
      run: |
        # Устанавливаем Docker Compose
        sudo curl -L "https://github.com/docker/compose/releases/download/v2.24.6/docker-compose-$(uname -s)-$(uname -m)" -o /usr/local/bin/docker-compose
        sudo chmod +x /usr/local/bin/docker-compose
        docker-compose --version    

    - name: Build Docker images
      run: |
        docker-compose -f docker-compose.yml build

  deploy:
    needs: test-and-build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/feature/homework_34_2' || github.ref == 'refs/heads/develop'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy with Docker Compose
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_HOST }}
        username: ${{ secrets.SERVER_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        port: ${{ secrets.SERVER_PORT }}
        script: |
          # Активируем окружение
          cd /home/phne-masq5ftz/projects/DRF_30
          
          # 1. Останавливаем systemd-сервисы (освобождаем порт 80)
          sudo systemctl stop nginx
          sudo systemctl stop gunicorn
  
          # 2. Отключаем автозапуск systemd-сервисов
          sudo systemctl disable nginx gunicorn
  
          # 3. Обновляем код
          git fetch origin
          git reset --hard origin/${{ github.ref_name }}
  
          # 4. Останавливаем старые Docker-контейнеры
          docker-compose -f docker-compose.prod.yml down || true
  
          # 5. Запускаем PRODUCTION контейнеры
          docker-compose -f docker-compose.prod.yml up -d --build
  
          # 6. Очищаем неиспользуемые образы
          docker image prune -f
  
          echo "Production деплой через Docker Compose успешен! Systemd-сервисы остановлены, Docker контейнеры запущены."
